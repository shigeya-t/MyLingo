<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title data-i18n="unlock.pageTitle">Unlock MyLingo</title>
    <link rel="stylesheet" href="ui.css" />
  </head>
  <body class="popup unlock-window">
    <header class="topbar">
      <span class="brand"><img class="brand-mark" src="icons/icon.svg" alt="" />MyLingo</span>
    </header>
    <p class="status warn" id="message" data-i18n="unlock.message"></p>
    <input id="passphrase" class="model-input" type="password" autocomplete="current-password" data-i18n-attr="placeholder:passphrase;aria-label:passphrase" hidden />
    <button id="unlockButton" class="primary-button" data-i18n="unlock.button"></button>
    <p class="status error" id="error" role="alert"></p>
    <script src="lib/vault.js"></script>
    <script type="module" src="unlock.js"></script>
  </body>
</html>
