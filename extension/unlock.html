<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <title>MyLingo ロック解除</title>
    <link rel="stylesheet" href="ui.css" />
  </head>
  <body class="popup unlock-window">
    <header class="topbar">
      <span class="brand"><span class="brand-mark"><i></i><i></i><i></i></span>MyLingo</span>
    </header>
    <p class="status warn" id="message">APIキーがロックされています。解除すると翻訳を続けます。</p>
    <input id="passphrase" class="model-input" type="password" autocomplete="current-password" placeholder="パスフレーズ" aria-label="パスフレーズ" hidden />
    <button id="unlockButton" class="primary-button">ロックを解除</button>
    <p class="status error" id="error" role="alert"></p>
    <script src="lib/vault.js"></script>
    <script type="module" src="unlock.js"></script>
  </body>
</html>
