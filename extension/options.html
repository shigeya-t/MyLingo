<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title data-i18n="options.pageTitle">MyLingo Settings</title>
    <link rel="stylesheet" href="ui.css" />
  </head>
  <body class="options">
    <main class="options-shell">
      <header class="options-head">
        <div class="topbar"><span class="brand"><img class="brand-mark" src="icons/icon.svg" alt="" />MyLingo</span><span id="langSwitch"></span></div>
        <p class="eyebrow" data-i18n="settings.eyebrow">LOCAL SETTINGS</p>
        <h1 data-i18n="settings.title">Connection settings</h1>
        <p class="settings-description" data-i18n-html="options.description"></p>
      </header>

      <section class="provider-card vault" aria-labelledby="vaultTitle">
        <h2 id="vaultTitle" data-i18n="vault.title">API key encryption</h2>
        <div id="vaultPanel"></div>
      </section>

      <form id="settingsForm">
        <div id="providerFields"></div>
        <button type="submit" class="primary-button" data-i18n="settings.save">Save</button>
      </form>

      <p class="security-note" data-i18n="options.securityNote"></p>
      <p class="repo-link"><a href="https://github.com/shigeya-t/MyLingo" target="_blank" rel="noopener noreferrer" data-i18n="settings.repo">Source code on GitHub ↗</a></p>
      <p class="commit-hash"><span data-i18n="settings.commit">Commit</span> <span id="commitHash"></span></p>
    </main>
    <div id="toast" class="toast" role="status"></div>
    <script src="lib/version.js"></script>
    <script src="lib/vault.js"></script>
    <script type="module" src="options.js"></script>
  </body>
</html>
