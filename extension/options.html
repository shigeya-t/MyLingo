<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <title>MyLingo 設定</title>
    <link rel="stylesheet" href="ui.css" />
  </head>
  <body class="options">
    <main class="options-shell">
      <header class="options-head">
        <span class="brand"><span class="brand-mark"><i></i><i></i><i></i></span>MyLingo</span>
        <p class="eyebrow">LOCAL SETTINGS</p>
        <h1>接続設定</h1>
        <p class="settings-description">各AIサービスのAPIキーとモデル名を入力してください。キーはこのブラウザの拡張機能ストレージ（<code>chrome.storage.local</code>）にのみ保存されます。</p>
      </header>

      <form id="settingsForm">
        <div id="providerFields"></div>
        <button type="submit" class="primary-button">保存する</button>
      </form>

      <p class="security-note">翻訳時は、ページのテキストとAPIキーが拡張機能から各AIサービスのAPIへ直接送信されます。サーバーを経由しません。パスワード入力欄・テキスト入力欄・コードブロックは翻訳の対象外です。</p>
    </main>
    <div id="toast" class="toast" role="status"></div>
    <script type="module" src="options.js"></script>
  </body>
</html>
